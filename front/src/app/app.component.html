<div class="app">
  <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
    <span>Yoga app</span>
    @if ($isLogged() | async) {
      <div>
        <span data-testid="nav-sessions-action" routerLink="sessions" class="link">Sessions</span>
        <span data-testid="nav-account-action" routerLink="me" class="link">Account</span>
        <span data-testid="nav-logout-action" (click)="logout()" class="link">Logout</span>
      </div>
    } @else {
      <div>
        <a data-testid="nav-login-action" routerLink="/login" routerLinkActive="active" class="link">Login</a>
        <a data-testid="nav-register-action" routerLink="/register" routerLinkActive="active" class="link">Register</a>
      </div>
    }
  </mat-toolbar>
  <div>
    <router-outlet></router-outlet>
  </div>
</div>
