<div class="create m3">
  <mat-card>
    <mat-card-title>
      <div fxLayout="row" fxLayoutAlign="start center">
        <button data-testid="form-back-action" mat-icon-button routerLink="/sessions">
          <mat-icon>arrow_back</mat-icon>
        </button>
        @if (onUpdate) {
          <h1 data-testid="form-title-text">Update session</h1>
        } @else {
          <h1 data-testid="form-title-text">Create session</h1>
        }
      </div>
    </mat-card-title>
    @if (sessionForm) {
      <mat-card-content>
        <form class="mt2" fxLayout="column" [formGroup]="sessionForm" (ngSubmit)="submit()">
          <mat-form-field appearance="outline" class="" fxFlex>
            <mat-label>Name</mat-label>
            <input data-testid="form-name-field" matInput formControlName="name">
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex>
            <mat-label>Date</mat-label>
            <input data-testid="form-date-field" matInput type="date" formControlName="date">
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Teacher</mat-label>
            <mat-select data-testid="form-teacher-field" ngDefaultControl formControlName="teacher_id">
              @for (teacher of teachers$ | async; track teacher.id) {
                <mat-option data-testid="form-teacher-option" [value]="teacher.id">
                  {{teacher.firstName}} {{teacher.lastName}}
                </mat-option>
              }
            </mat-select>
          </mat-form-field>
          <mat-form-field appearance="outline" fxFlex>
            <mat-label>Description</mat-label>
            <textarea data-testid="form-description-field" matInput rows="8" formControlName="description"></textarea>
          </mat-form-field>
          <div fxLayout="row" fxLayoutAlign="center center">
            <button data-testid="form-save-action" mat-raised-button color="primary" type="submit" [disabled]="sessionForm.invalid">
              Save
            </button>
          </div>
        </form>
      </mat-card-content>
    }
  </mat-card>
</div>
