<div class="register" fxLayout="row" fxLayoutAlign="center center">
    <mat-card>
        <mat-card-header fxLayoutAlign="center center">
            <mat-card-title>Register</mat-card-title>
        </mat-card-header>
        <form class="register-form" [formGroup]="form" (ngSubmit)="submit()">
            <mat-card-content fxLayout="column">
                <mat-form-field fxFlex>
                    <input data-testid="register-first-name-field" matInput placeholder="First name" formControlName="firstName">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input data-testid="register-last-name-field" matInput placeholder="Last name" formControlName="lastName">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input data-testid="register-email-field" matInput placeholder="Email" formControlName="email">
                </mat-form-field>
                <mat-form-field fxFlex>
                    <input data-testid="register-password-field" matInput placeholder="Password" formControlName="password">
                </mat-form-field>
            </mat-card-content>
            <button data-testid="register-submit-action" mat-raised-button color="primary" type="submit" [disabled]="form.invalid">Submit</button>
            @if (onError) {
                <span data-testid="register-error-message" class="error ml2">An error occurred</span>
            }
        </form>
    </mat-card>
</div>
